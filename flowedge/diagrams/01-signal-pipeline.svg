<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 980" width="1180" height="980" role="img" aria-label="FlowEdge signal pipeline: three price features are divided by live volatility and squashed into a common range before they are weighted and blended"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs><rect width="1180" height="980" fill="#ffffff"/><text x="590" y="44" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" fill="#0f172a" text-anchor="middle">FlowEdge — Signal Pipeline</text><text x="590" y="70" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#64748b" text-anchor="middle">Every feature is normalised into the same unit before it is weighted</text><rect x="70" y="108" width="470" height="46" rx="8" fill="#0284c7"/><text x="305.0" y="129.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">FAST CANDLES · 3m</text><text x="305.0" y="146.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#e2e8f0" text-anchor="middle">signal generation</text><rect x="650" y="108" width="460" height="46" rx="8" fill="#c2410c"/><text x="880.0" y="129.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">SLOW CANDLES · 15m</text><text x="880.0" y="146.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#e2e8f0" text-anchor="middle">regime classification</text><rect x="70" y="196" width="146" height="66" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.8"/><text x="143.0" y="218.75" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#475569" text-anchor="middle">Candle Flow</text><text x="143.0" y="243.75" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.5" font-weight="normal" fill="#64748b" text-anchor="middle">(close−open) / (high−low)</text><text x="143.0" y="255.25" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.5" font-weight="normal" fill="#64748b" text-anchor="middle">5-bar mean</text><line x1="143" y1="154" x2="143" y2="194" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/><rect x="232" y="196" width="146" height="66" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.8"/><text x="305.0" y="218.75" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#475569" text-anchor="middle">VWAP Extension</text><text x="305.0" y="243.75" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.5" font-weight="normal" fill="#64748b" text-anchor="middle">(close − VWAP) / VWAP</text><text x="305.0" y="255.25" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.5" font-weight="normal" fill="#64748b" text-anchor="middle">rolling 24-bar window</text><line x1="305" y1="154" x2="305" y2="194" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/><rect x="394" y="196" width="146" height="66" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.8"/><text x="467.0" y="218.75" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#475569" text-anchor="middle">Trend</text><text x="467.0" y="243.75" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.5" font-weight="normal" fill="#64748b" text-anchor="middle">close − EMA(21)</text><text x="467.0" y="255.25" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.5" font-weight="normal" fill="#64748b" text-anchor="middle">in ATR units</text><line x1="467" y1="154" x2="467" y2="194" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/><rect x="70" y="300" width="470" height="70" rx="8" fill="#d1fae5" stroke="#047857" stroke-width="1.8"/><text x="305" y="322" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="14" font-weight="bold" fill="#047857" text-anchor="middle">÷ live NATR   →   tanh( x / 2 )</text><text x="305" y="341" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#64748b" text-anchor="middle">price-space features become volatility units, then saturate into [−1, +1]</text><text x="305" y="356" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#64748b" text-anchor="middle" font-style="italic">all three now share one range, so the weights below are the weights that apply</text><line x1="143" y1="262" x2="143" y2="298" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/><line x1="305" y1="262" x2="305" y2="298" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/><line x1="467" y1="262" x2="467" y2="298" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/><rect x="650" y="196" width="460" height="66" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="1.8"/><text x="880.0" y="225.75" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#c2410c" text-anchor="middle">ADX(14) + Directional Indicators</text><text x="880.0" y="253.25" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#64748b" text-anchor="middle">ADX gives trend strength · DI+/DI− give its direction</text><line x1="880" y1="154" x2="880" y2="194" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/><rect x="650" y="300" width="215" height="54" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="1.8"/><text x="757.5" y="323.5" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#c2410c" text-anchor="middle">Regime gate</text><text x="757.5" y="349.5" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#64748b" text-anchor="middle">RANGING / TRENDING / EXTREME</text><rect x="895" y="300" width="215" height="54" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="1.8"/><text x="1002.5" y="323.5" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#c2410c" text-anchor="middle">DI bias</text><text x="1002.5" y="349.5" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#64748b" text-anchor="middle">(DI+ − DI−) / (DI+ + DI−)</text><line x1="757" y1="262" x2="757" y2="298" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/><line x1="1002" y1="262" x2="1002" y2="298" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/><rect x="230" y="404" width="660" height="62" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.8"/><text x="560.0" y="431.25" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#6d28d9" text-anchor="middle">Weighted blend  →  score ∈ [−1, +1]</text><text x="560.0" y="459.75" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#64748b" text-anchor="middle">0.35 · flow    +    0.25 · vwap    +    0.25 · trend    +    0.15 · DI bias</text><polyline points="305,370 305,388 450,388 450,402" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/><polyline points="1002,354 1002,384 760,384 760,402" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/><rect x="230" y="498" width="315" height="70" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.8"/><text x="387.5" y="523.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#475569" text-anchor="middle">RSI dampener</text><text x="387.5" y="550.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#64748b" text-anchor="middle">proportional, not a veto:</text><text x="387.5" y="562.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#64748b" text-anchor="middle">RSI 72 trims · RSI 90 erases</text><rect x="575" y="498" width="315" height="70" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.8"/><text x="732.5" y="523.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#475569" text-anchor="middle">Funding bias · perps</text><text x="732.5" y="550.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#64748b" text-anchor="middle">− strength · tanh(rate / threshold)</text><text x="732.5" y="562.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#64748b" text-anchor="middle">continuous, saturating</text><line x1="387" y1="466" x2="387" y2="496" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/><line x1="732" y1="466" x2="732" y2="496" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/><polygon points="560,584.0 710.0,630 560,676.0 410.0,630" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.8"/><text x="560" y="627" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#0284c7" text-anchor="middle">|score| ≥ adapted threshold ?</text><text x="560" y="643" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#64748b" text-anchor="middle">and the regime gate is open</text><polyline points="387,568 387,592 470,592 500,614" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/><polyline points="732,568 732,592 650,592 620,614" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/><rect x="60" y="602" width="190" height="56" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.8"/><text x="155.0" y="627.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#b91c1c" text-anchor="middle">signal = 0</text><text x="155.0" y="654.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#64748b" text-anchor="middle">no entry this tick</text><line x1="410" y1="630" x2="252" y2="630" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/><text x="331.0" y="624.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#64748b" text-anchor="middle" font-style="italic">no</text><rect x="330" y="706" width="460" height="56" rx="8" fill="#d1fae5" stroke="#047857" stroke-width="1.8"/><text x="560.0" y="738.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#047857" text-anchor="middle">signal = +1 LONG   /   −1 SHORT</text><line x1="560" y1="676" x2="560" y2="704" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/><text x="560.0" y="684.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#64748b" text-anchor="middle" font-style="italic">yes</text><rect x="330" y="790" width="460" height="68" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.8"/><text x="560.0" y="814.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#0284c7" text-anchor="middle">DCA ladder · MAKER · 3 levels</text><text x="560.0" y="841.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#64748b" text-anchor="middle">prices, stop-loss, take-profit and trailing stop</text><text x="560.0" y="853.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#64748b" text-anchor="middle">all scaled by  clamp(NATR / baseline, 0.6, 2.5)</text><line x1="560" y1="762" x2="560" y2="788" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/><rect x="330" y="886" width="460" height="58" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.8"/><text x="560.0" y="912.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#b91c1c" text-anchor="middle">Emergency exit  ·  stop_actions_proposal()</text><text x="560.0" y="939.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#64748b" text-anchor="middle">closes any executor past −5% — MAKER defers its own stop</text><line x1="560" y1="858" x2="560" y2="884" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/><rect x="880" y="706" width="250" height="152" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.8"/><text x="1005.0" y="764.25" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#6d28d9" text-anchor="middle">Self-adaptation</text><text x="1005.0" y="791.75" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#64748b" text-anchor="middle">closed executors →</text><text x="1005.0" y="804.25" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#64748b" text-anchor="middle">rolling win rate + turnover</text><text x="1005.0" y="816.75" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#64748b" text-anchor="middle">→ steers the threshold</text><polyline points="790,915 1005,915 1005,860" fill="none" stroke="#6d28d9" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ah)"/><polyline points="880,782 830,782 830,660 712,660" fill="none" stroke="#6d28d9" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ah)"/><text x="1005" y="934" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#6d28d9" text-anchor="middle" font-style="italic">closed P&amp;L feeds back each tick</text></svg>
