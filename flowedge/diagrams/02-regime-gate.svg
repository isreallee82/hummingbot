<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 760" width="1180" height="760" role="img" aria-label="FlowEdge regime gate: the slow timeframe halts on an extreme reading while the fast timeframe merely fails to confirm"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs><rect width="1180" height="760" fill="#ffffff"/><text x="590" y="44" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" fill="#0f172a" text-anchor="middle">Regime Gate — Why the Two Timeframes Differ</text><text x="590" y="70" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#64748b" text-anchor="middle">ADX(14) is computed on both frames, but only the slow frame can halt the strategy</text><rect x="120" y="110" width="380" height="46" rx="8" fill="#c2410c"/><text x="310.0" y="131.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">SLOW · 15m</text><text x="310.0" y="148.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#e2e8f0" text-anchor="middle">the risk-off filter</text><rect x="680" y="110" width="380" height="46" rx="8" fill="#0284c7"/><text x="870.0" y="131.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">FAST · 3m</text><text x="870.0" y="148.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#e2e8f0" text-anchor="middle">the confirmation vote</text><polygon points="310,198.0 420.0,240 310,282.0 200.0,240" fill="#ffedd5" stroke="#c2410c" stroke-width="1.8"/><text x="310" y="244" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#c2410c" text-anchor="middle">ADX on 15m</text><line x1="310" y1="156" x2="310" y2="198" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/><rect x="120" y="330" width="150" height="62" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.8"/><text x="195.0" y="358.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#b91c1c" text-anchor="middle">EXTREME</text><text x="195.0" y="385.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#64748b" text-anchor="middle">ADX ≥ 50</text><rect x="285" y="330" width="150" height="62" rx="8" fill="#d1fae5" stroke="#047857" stroke-width="1.8"/><text x="360.0" y="358.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#047857" text-anchor="middle">TRENDING</text><text x="360.0" y="385.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#64748b" text-anchor="middle">22 ≤ ADX &lt; 50</text><rect x="450" y="330" width="150" height="62" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.8"/><text x="525.0" y="358.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#475569" text-anchor="middle">RANGING</text><text x="525.0" y="385.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#64748b" text-anchor="middle">ADX &lt; 22</text><line x1="255" y1="265" x2="200" y2="328" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/><line x1="310" y1="282" x2="355" y2="328" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/><line x1="365" y1="265" x2="520" y2="328" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/><polygon points="870,198.0 980.0,240 870,282.0 760.0,240" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.8"/><text x="870" y="244" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#0284c7" text-anchor="middle">ADX on 3m</text><line x1="870" y1="156" x2="870" y2="198" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/><rect x="680" y="330" width="150" height="62" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.8"/><text x="755.0" y="358.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#475569" text-anchor="middle">EXTREME</text><text x="755.0" y="385.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#64748b" text-anchor="middle">ADX ≥ 50</text><rect x="845" y="330" width="150" height="62" rx="8" fill="#d1fae5" stroke="#047857" stroke-width="1.8"/><text x="920.0" y="358.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#047857" text-anchor="middle">TRENDING</text><text x="920.0" y="385.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#64748b" text-anchor="middle">22 ≤ ADX &lt; 50</text><rect x="1010" y="330" width="150" height="62" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.8"/><text x="1085.0" y="358.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#475569" text-anchor="middle">RANGING</text><text x="1085.0" y="385.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#64748b" text-anchor="middle">ADX &lt; 22</text><line x1="815" y1="265" x2="760" y2="328" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/><line x1="870" y1="282" x2="915" y2="328" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/><line x1="925" y1="265" x2="1080" y2="328" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/><text x="195" y="412" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#b91c1c" text-anchor="middle">halts everything</text><text x="195" y="428" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#64748b" text-anchor="middle" font-style="italic">crash / parabolic squeeze</text><text x="755" y="412" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">does NOT halt</text><text x="755" y="428" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#64748b" text-anchor="middle" font-style="italic">ADX(3m) &gt; 50 is routine in crypto</text><text x="755" y="444" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#64748b" text-anchor="middle" font-style="italic">it just fails to confirm</text><rect x="390" y="490" width="400" height="70" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.8"/><text x="590.0" y="521.75" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#6d28d9" text-anchor="middle">Entry gate</text><text x="590.0" y="549.25" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#64748b" text-anchor="middle">at least one frame TRENDING, and the slow frame not EXTREME</text><polyline points="360,392 360,452 520,452 520,488" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/><polyline points="920,392 920,452 660,452 660,488" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/><rect x="60" y="620" width="205" height="76" rx="8" fill="#d1fae5" stroke="#047857" stroke-width="1.8"/><text x="162.5" y="648.5" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#047857" text-anchor="middle">gate = "both"</text><text x="162.5" y="675.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.5" font-weight="normal" fill="#64748b" text-anchor="middle">slow + fast agree</text><text x="162.5" y="686.5" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.5" font-weight="normal" fill="#64748b" text-anchor="middle">strongest conviction</text><rect x="345" y="620" width="205" height="76" rx="8" fill="#d1fae5" stroke="#047857" stroke-width="1.8"/><text x="447.5" y="648.5" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#047857" text-anchor="middle">gate = "slow"</text><text x="447.5" y="675.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.5" font-weight="normal" fill="#64748b" text-anchor="middle">15m confirms alone</text><text x="447.5" y="686.5" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.5" font-weight="normal" fill="#64748b" text-anchor="middle">standard mode</text><rect x="630" y="620" width="205" height="76" rx="8" fill="#d1fae5" stroke="#047857" stroke-width="1.8"/><text x="732.5" y="648.5" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#047857" text-anchor="middle">gate = "fast"</text><text x="732.5" y="675.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.5" font-weight="normal" fill="#64748b" text-anchor="middle">3m confirms alone</text><text x="732.5" y="686.5" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.5" font-weight="normal" fill="#64748b" text-anchor="middle">needs allow_fast_regime_entry</text><rect x="915" y="620" width="205" height="76" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.8"/><text x="1017.5" y="648.5" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#b91c1c" text-anchor="middle">gate = "none / halt"</text><text x="1017.5" y="675.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.5" font-weight="normal" fill="#64748b" text-anchor="middle">no confirmation, or</text><text x="1017.5" y="686.5" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.5" font-weight="normal" fill="#64748b" text-anchor="middle">slow frame EXTREME</text><polyline points="590,560 590,590 162,590 162,618" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/><polyline points="590,560 590,590 447,590 447,618" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/><polyline points="590,560 590,590 732,590 732,618" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/><polyline points="590,560 590,590 1017,590 1017,618" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/><polyline points="195,392 195,578 1017,578 1017,618" fill="none" stroke="#b91c1c" stroke-width="1.8" marker-end="url(#ah)"/><text x="600" y="570" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#b91c1c" text-anchor="middle" font-style="italic">slow frame EXTREME bypasses the gate — nothing can open</text><text x="590" y="726" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#64748b" text-anchor="middle" font-style="italic">signal is forced to 0 whenever the gate is "none" or "halt"</text></svg>
