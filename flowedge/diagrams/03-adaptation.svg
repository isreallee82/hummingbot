<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 720" width="1180" height="720" role="img" aria-label="Threshold trajectory: the target-tracking rule recovers after a losing streak while the ratcheting rule it replaced latches above the reachable score range and stops trading"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs><rect width="1180" height="720" fill="#ffffff"/><text x="590" y="42" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" fill="#0f172a" text-anchor="middle">Self-Adaptation — Target-Tracking vs. Ratcheting</text><text x="590" y="68" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#64748b" text-anchor="middle">Same trade sequence through both rules. Generated by running the real controller.</text><rect x="90" y="110" width="700" height="420" fill="#fbfcfd" stroke="#94a3b8" stroke-width="1"/><rect x="90" y="110" width="700" height="128.79999999999998" fill="#fee2e2" opacity="0.65"/><text x="780" y="228.79999999999998" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#b91c1c" text-anchor="end" font-style="italic">above this, no score can ever clear the threshold</text><line x1="90" y1="238.79999999999998" x2="790" y2="238.79999999999998" stroke="#b91c1c" stroke-width="1.4" stroke-dasharray="7 4"/><line x1="90" y1="502.0" x2="790" y2="502.0" stroke="#94a3b8" stroke-width="0.6" stroke-dasharray="2 4"/><text x="78" y="506.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#64748b" text-anchor="end">0.15</text><line x1="90" y1="418.00000000000006" x2="790" y2="418.00000000000006" stroke="#94a3b8" stroke-width="0.6" stroke-dasharray="2 4"/><text x="78" y="422.00000000000006" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#64748b" text-anchor="end">0.30</text><line x1="90" y1="334.0" x2="790" y2="334.0" stroke="#94a3b8" stroke-width="0.6" stroke-dasharray="2 4"/><text x="78" y="338.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#64748b" text-anchor="end">0.45</text><line x1="90" y1="250.0" x2="790" y2="250.0" stroke="#94a3b8" stroke-width="0.6" stroke-dasharray="2 4"/><text x="78" y="254.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#64748b" text-anchor="end">0.60</text><line x1="90" y1="166.0" x2="790" y2="166.0" stroke="#94a3b8" stroke-width="0.6" stroke-dasharray="2 4"/><text x="78" y="170.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#64748b" text-anchor="end">0.75</text><line x1="90" y1="502.0" x2="790" y2="502.0" stroke="#047857" stroke-width="1.2"/><text x="98" y="495.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#047857" text-anchor="start" font-style="italic">floor 0.15</text><line x1="90" y1="250.0" x2="790" y2="250.0" stroke="#047857" stroke-width="1.2"/><text x="98" y="265.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#047857" text-anchor="start" font-style="italic">ceiling 0.60</text><line x1="193.7037037037037" y1="110" x2="193.7037037037037" y2="530" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="3 3"/><text x="141.85185185185185" y="550" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#64748b" text-anchor="middle" font-style="italic">8 losing trades</text><line x1="517.7777777777778" y1="110" x2="517.7777777777778" y2="530" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="3 3"/><text x="355.74074074074076" y="550" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#64748b" text-anchor="middle" font-style="italic">quiet — nothing opens</text><line x1="699.2592592592592" y1="110" x2="699.2592592592592" y2="530" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="3 3"/><text x="608.5185185185185" y="550" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#64748b" text-anchor="middle" font-style="italic">14 winning trades</text><polyline points="90.0,418.0 103.0,418.0 115.9,390.0 128.9,362.0 141.9,334.0 154.8,306.0 167.8,278.0 180.7,250.0 193.7,222.0 206.7,194.0 219.6,166.0 232.6,166.0 245.6,166.0 258.5,166.0 271.5,166.0 284.4,166.0 297.4,166.0 310.4,166.0 323.3,166.0 336.3,166.0 349.3,166.0 362.2,166.0 375.2,166.0 388.1,166.0 401.1,166.0 414.1,166.0 427.0,166.0 440.0,166.0 453.0,166.0 465.9,166.0 478.9,166.0 491.9,166.0 504.8,166.0 517.8,166.0 530.7,166.0 543.7,166.0 556.7,166.0 569.6,166.0 582.6,166.0 595.6,166.0 608.5,166.0 621.5,166.0 634.4,166.0 647.4,166.0 660.4,166.0 673.3,166.0 686.3,166.0 699.3,166.0 712.2,166.0 725.2,166.0 738.1,166.0 751.1,166.0 764.1,166.0 777.0,166.0 790.0,166.0" fill="none" stroke="#b91c1c" stroke-width="2.6" stroke-linejoin="round" stroke-dasharray="7 4"/><polyline points="90.0,418.0 103.0,418.0 115.9,418.0 128.9,406.8 141.9,395.6 154.8,384.4 167.8,373.2 180.7,362.0 193.7,350.8 206.7,339.6 219.6,328.4 232.6,317.2 245.6,306.0 258.5,294.8 271.5,283.6 284.4,272.4 297.4,283.6 310.4,294.8 323.3,306.0 336.3,317.2 349.3,328.4 362.2,339.6 375.2,350.8 388.1,362.0 401.1,373.2 414.1,384.4 427.0,395.6 440.0,406.8 453.0,418.0 465.9,429.2 478.9,440.4 491.9,451.6 504.8,462.8 517.8,451.6 530.7,440.4 543.7,429.2 556.7,418.0 569.6,406.8 582.6,418.0 595.6,418.0 608.5,418.0 621.5,418.0 634.4,418.0 647.4,418.0 660.4,418.0 673.3,418.0 686.3,429.2 699.3,440.4 712.2,451.6 725.2,462.8 738.1,474.0 751.1,485.2 764.1,496.4 777.0,502.0 790.0,502.0" fill="none" stroke="#047857" stroke-width="2.6" stroke-linejoin="round"/><text x="776.0" y="154.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#b91c1c" text-anchor="end">ratchet — latched at 0.75</text><text x="776.0" y="488.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#047857" text-anchor="end">target-tracking — 0.15</text><text x="440.0" y="576" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#64748b" text-anchor="middle">closed trades over time  →</text><text x="30" y="320.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" transform="rotate(-90 30 320.0)">entry threshold</text><rect x="840" y="110" width="300" height="130" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.8"/><text x="990.0" y="144.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#b91c1c" text-anchor="middle">The ratchet latches</text><text x="990.0" y="171.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#64748b" text-anchor="middle">Losses push it up in 0.05 steps and</text><text x="990.0" y="183.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#64748b" text-anchor="middle">loosening floors at the config base.</text><text x="990.0" y="195.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#64748b" text-anchor="middle">Once it passes the reachable range,</text><text x="990.0" y="207.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#64748b" text-anchor="middle">no entry fires — so no trade closes,</text><text x="990.0" y="219.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#64748b" text-anchor="middle">so the win-rate window never updates.</text><rect x="840" y="258" width="300" height="130" rx="8" fill="#d1fae5" stroke="#047857" stroke-width="1.8"/><text x="990.0" y="292.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#047857" text-anchor="middle">Target-tracking recovers</text><text x="990.0" y="319.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#64748b" text-anchor="middle">Each tick it moves one small step</text><text x="990.0" y="331.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#64748b" text-anchor="middle">toward a target set by win rate and</text><text x="990.0" y="343.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#64748b" text-anchor="middle">turnover. Every state is reachable</text><text x="990.0" y="355.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#64748b" text-anchor="middle">from every other, so a losing streak</text><text x="990.0" y="367.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#64748b" text-anchor="middle">can tighten it but never trap it.</text><rect x="840" y="406" width="300" height="124" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.8"/><text x="990.0" y="437.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#6d28d9" text-anchor="middle">Turnover governor</text><text x="990.0" y="464.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#64748b" text-anchor="middle">When nothing has opened for 30 min</text><text x="990.0" y="476.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#64748b" text-anchor="middle">the target drops to the floor —</text><text x="990.0" y="488.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#64748b" text-anchor="middle">measured from the controller's own</text><text x="990.0" y="500.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#64748b" text-anchor="middle">age when nothing has EVER opened,</text><text x="990.0" y="512.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#64748b" text-anchor="middle">which closes the cold-start hole.</text><text x="590" y="600" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">How a closed trade reaches the threshold</text><rect x="60" y="622" width="180" height="62" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.8"/><text x="150.0" y="649.5" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#475569" text-anchor="middle">Executor terminates</text><text x="150.0" y="674.5" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.5" font-weight="normal" fill="#64748b" text-anchor="middle">close_type set</text><rect x="295" y="622" width="180" height="62" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.8"/><text x="385.0" y="649.5" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#475569" text-anchor="middle">Keyed by id</text><text x="385.0" y="674.5" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.5" font-weight="normal" fill="#64748b" text-anchor="middle">_seen_closed_ids — never by index</text><rect x="530" y="622" width="180" height="62" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.8"/><text x="620.0" y="649.5" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#475569" text-anchor="middle">Rolling window</text><text x="620.0" y="674.5" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.5" font-weight="normal" fill="#64748b" text-anchor="middle">last 20 P&amp;Ls (deque)</text><rect x="765" y="622" width="180" height="62" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.8"/><text x="855.0" y="649.5" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#475569" text-anchor="middle">Target chosen</text><text x="855.0" y="674.5" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.5" font-weight="normal" fill="#64748b" text-anchor="middle">win rate + turnover</text><rect x="1000" y="622" width="180" height="62" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.8"/><text x="1090.0" y="649.5" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#6d28d9" text-anchor="middle">Step 0.02</text><text x="1090.0" y="674.5" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.5" font-weight="normal" fill="#64748b" text-anchor="middle">toward target, clamped</text><line x1="240" y1="653" x2="295" y2="653" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/><line x1="475" y1="653" x2="530" y2="653" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/><line x1="710" y1="653" x2="765" y2="653" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/><line x1="945" y1="653" x2="1000" y2="653" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/></svg>
